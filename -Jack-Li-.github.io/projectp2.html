<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Part 2: Asteroid Belt Projects | Jack</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            overflow: hidden; /* 防止出现滚动条，保持满屏沉浸感 */
        }

        .asteroid-canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            background-color: var(--bg-primary);
        }

        #asteroidCanvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* 覆盖在 Canvas 上的导航提示 */
        .asteroid-overlay {
            position: fixed;
            top: 100px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 10;
            pointer-events: none;
        }

        .asteroid-overlay h1 {
            font-size: 2.8rem;
            color: #ffffff;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.4);
            margin-bottom: 0.5rem;
        }

        .asteroid-overlay p {
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        .top-nav-btn {
            position: fixed;
            top: 90px;
            left: 2rem;
            z-index: 20;
        }
    </style>
</head>
<body class="home-body">

    <header>
        <nav class="navbar">
            <div class="logo"><a href="index.html">Jack's Portfolio</a></div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="projects.html" class="active">Projects</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- 返回按钮 -->
    <a href="projects.html" class="btn btn-outline top-nav-btn">&larr; Back to Projects</a>

    <!-- 标题 overlay -->
    <div class="asteroid-overlay">
        <h1>Asteroid Belt Projects</h1>
        <p>Hover over large asteroids to reveal featured projects</p>
    </div>

    <!-- 2D Canvas 容器 -->
    <div class="asteroid-canvas-container">
        <canvas id="asteroidCanvas"></canvas>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const canvas = document.getElementById('asteroidCanvas');
            if (!canvas) return;

            const ctx = canvas.getContext('2d');
            let width = (canvas.width = window.innerWidth);
            let height = (canvas.height = window.innerHeight);

            window.addEventListener('resize', () => {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
            });

            let mousePos = { x: -1000, y: -1000 };
            let hoveredAsteroid = null;

            // ==========================================
            // 1. 无交互小陨石群 (背景流)
            // ==========================================
            const smallAsteroids = [];
            const SMALL_COUNT = 120; // 小陨石数量

            for (let i = 0; i < SMALL_COUNT; i++) {
                smallAsteroids.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    radius: Math.random() * 2.5 + 0.8,
                    speedY: Math.random() * 0.6 + 0.2, // 慢慢从上往下漂
                    speedX: (Math.random() - 0.5) * 0.15,
                    color: Math.random() > 0.4 ? '#94a3b8' : '#64748b',
                    opacity: Math.random() * 0.6 + 0.3
                });
            }

            // ==========================================
            // 2. 大陨石 (项目卡片数据，可随时添加/调节数量)
            // ==========================================
            const largeAsteroids = [
                {
                    id: 'portfolio',
                    title: 'Interactive 3D/2D Portfolio',
                    subtitle: 'Click to see the project details!',
                    x: width * 0.5,       // 初始居中偏上方
                    y: height * 0.35,
                    radius: 55,           // 大陨石尺寸
                    speedY: 0.35,         // 下落速度
                    targetUrl: 'index.html',
                    color: '#38bdf8',
                    rotation: 0,
                    rotationSpeed: 0.005,
                    // 不规则多边形节点（让陨石看起来像石头而非完美圆形）
                    shapeVertices: [
                        { angle: 0, scale: 1.1 },
                        { angle: Math.PI * 0.3, scale: 0.85 },
                        { angle: Math.PI * 0.6, scale: 1.05 },
                        { angle: Math.PI * 0.9, scale: 0.9 },
                        { angle: Math.PI * 1.2, scale: 1.15 },
                        { angle: Math.PI * 1.5, scale: 0.95 },
                        { angle: Math.PI * 1.8, scale: 1.02 }
                    ]
                }
                /* 后期可以在这里轻松扩展更多大陨石项目：
                ,{
                    id: 'project2',
                    title: 'Future Algorithm Engine',
                    subtitle: 'Coming soon...',
                    x: width * 0.25,
                    y: -100,
                    radius: 48,
                    speedY: 0.4,
                    targetUrl: '#',
                    color: '#fde047',
                    ...
                }
                */
            ];

            // ==========================================
            // 3. 渲染主循环
            // ==========================================
            function animate() {
                ctx.clearRect(0, 0, width, height);

                // --- 绘制无交互小陨石 ---
                smallAsteroids.forEach(p => {
                    p.y += p.speedY;
                    p.x += p.speedX;

                    // 飘出屏幕底部后重新回到顶部
                    if (p.y > height + 10) {
                        p.y = -10;
                        p.x = Math.random() * width;
                    }

                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    ctx.fillStyle = p.color;
                    ctx.globalAlpha = p.opacity;
                    ctx.fill();
                    ctx.globalAlpha = 1.0;
                });

                // --- 绘制大陨石 (交互项目) ---
                hoveredAsteroid = null;

                largeAsteroids.forEach(ast => {
                    // 碰撞/悬停检测
                    const dist = Math.hypot(mousePos.x - ast.x, mousePos.y - ast.y);
                    const isHovered = dist < ast.radius + 15;

                    if (isHovered) {
                        hoveredAsteroid = ast;
                    } else {
                        // 没悬停时正常下落和缓慢旋转
                        ast.y += ast.speedY;
                        ast.rotation += ast.rotationSpeed;

                        // 飘出屏幕后循环回到顶部
                        if (ast.y > height + ast.radius * 2) {
                            ast.y = -ast.radius * 2;
                            ast.x = Math.random() * (width - 200) + 100;
                        }
                    }

                    // 绘制大陨石主体
                    ctx.save();
                    ctx.translate(ast.x, ast.y);
                    ctx.rotate(ast.rotation);

                    // 悬停高亮光晕
                    if (isHovered) {
                        const glowGrad = ctx.createRadialGradient(0, 0, ast.radius * 0.8, 0, 0, ast.radius + 25);
                        glowGrad.addColorStop(0, 'rgba(56, 189, 248, 0.5)');
                        glowGrad.addColorStop(1, 'rgba(56, 189, 248, 0)');
                        ctx.beginPath();
                        ctx.arc(0, 0, ast.radius + 25, 0, Math.PI * 2);
                        ctx.fillStyle = glowGrad;
                        ctx.fill();
                    }

                    // 绘制不规则岩石形状
                    ctx.beginPath();
                    ast.shapeVertices.forEach((v, index) => {
                        const r = ast.radius * v.scale;
                        const vx = Math.cos(v.angle) * r;
                        const vy = Math.sin(v.angle) * r;
                        if (index === 0) ctx.moveTo(vx, vy);
                        else ctx.lineTo(vx, vy);
                    });
                    ctx.closePath();

                    // 岩石填充与边框
                    ctx.fillStyle = isHovered ? '#1e293b' : '#0f172a';
                    ctx.strokeStyle = isHovered ? '#38bdf8' : '#475569';
                    ctx.lineWidth = isHovered ? 3 : 2;
                    ctx.fill();
                    ctx.stroke();

                    // 陨石表面纹理凹坑
                    ctx.fillStyle = isHovered ? 'rgba(56, 189, 248, 0.2)' : 'rgba(255, 255, 255, 0.05)';
                    ctx.beginPath();
                    ctx.arc(-ast.radius * 0.3, -ast.radius * 0.2, ast.radius * 0.25, 0, Math.PI * 2);
                    ctx.arc(ast.radius * 0.2, ast.radius * 0.3, ast.radius * 0.2, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.restore();

                    // 悬停时浮现项目名称 Title Label (在陨石右下方)
                    if (isHovered) {
                        drawAsteroidLabel(ast);
                    }
                });

                requestAnimationFrame(animate);
            }

            // 绘制悬停时的项目 Label 弹窗
            function drawAsteroidLabel(ast) {
                const lx = ast.x + ast.radius + 15;
                const ly = ast.y - 20;

                ctx.font = 'bold 16px "Inter", sans-serif';
                const titleWidth = ctx.measureText(ast.title).width;
                ctx.font = '13px "Inter", sans-serif';
                const subWidth = ctx.measureText(ast.subtitle).width;

                const boxWidth = Math.max(titleWidth, subWidth) + 30;
                const boxHeight = 56;

                // 悬停框背景
                ctx.fillStyle = 'rgba(15, 23, 42, 0.95)';
                ctx.strokeStyle = '#38bdf8';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.roundRect(lx, ly, boxWidth, boxHeight, 10);
                ctx.fill();
                ctx.stroke();

                // 标题与副标题文本
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 15px "Inter", sans-serif';
                ctx.fillText(ast.title, lx + 15, ly + 24);

                ctx.fillStyle = '#38bdf8';
                ctx.font = '13px "Inter", sans-serif';
                ctx.fillText(ast.subtitle, lx + 15, ly + 44);
            }

            // ==========================================
            // 4. 事件监听 (鼠标移动与点击)
            // ==========================================
            canvas.addEventListener('mousemove', (e) => {
                const rect = canvas.getBoundingClientRect();
                mousePos.x = e.clientX - rect.left;
                mousePos.y = e.clientY - rect.top;

                // 悬停在有交互的大陨石上时改变鼠标手势
                if (hoveredAsteroid) {
                    canvas.style.cursor = 'pointer';
                } else {
                    canvas.style.cursor = 'default';
                }
            });

            canvas.addEventListener('click', () => {
                if (hoveredAsteroid && hoveredAsteroid.targetUrl) {
                    // 点击后平滑跳转
                    window.location.href = hoveredAsteroid.targetUrl;
                }
            });

            animate();
        });
    </script>
</body>
</html>
