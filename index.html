<!--AI Usage:
I used ChatGPT to help me build the basic structure and make the website responsive. I have some thought about interactive design and the AI helped to achieve that.
I modified the suggested code to some extentto fit my portfolio design.-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jack's Solar Portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 顶栏导航 -->
    <header class="site-header">
        <nav class="navbar">
            <div class="logo">
                <button id="logoControlBtn" class="logo-btn">
                    🚀 Jack's Portfolio
                </button>
            </div>
            <ul class="nav-links">
                <li><a href="index.html" class="active">Home</a></li>
                <li><a href="about.html" id="nav-about">About</a></li>
                <li><a href="projects.html" id="nav-projects">Projects</a></li>
                <li><a href="contact.html" id="nav-contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- 左上角 Command Center 控制面板 -->
    <div id="controlPanel" class="control-panel-modal">
        <div class="panel-header">
            <h4>⚙️ Command Center</h4>
        </div>
        <div class="panel-item">
            <span>Dark Mode (深色模式)</span>
            <label class="switch">
                <input type="checkbox" id="darkModeToggle" checked>
                <span class="slider"></span>
            </label>
        </div>
    </div>

    <!-- 主页欢迎标语 Overlay (补回 Hi, I'm Jack) -->
    <div class="hero-overlay">
        <h1 class="hero-title">Hi, I'm Jack</h1>
        <p class="hero-subtitle">Explore the solar system to discover my work & journey</p>
    </div>

    <!-- 太阳系 2D Canvas -->
    <canvas id="solarCanvas"></canvas>

    <!-- 返回太阳系主视图按钮 (地月系下显示) -->
    <button id="backToSolarBtn" class="back-btn hidden">&larr; Back to Solar System</button>

    <!-- 自定义火箭光标 -->
    <div id="rocketCursor" class="custom-rocket-cursor">
        <svg class="rocket-svg" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path class="rocket-flame" d="M32 46C28 54 32 62 32 62C32 62 36 54 32 46Z" fill="#f97316"/>
            <path class="rocket-flame" d="M32 48C30 53 32 58 32 58C32 58 34 53 32 48Z" fill="#fde047"/>
            <path d="M32 6C22 16 20 32 20 40H44C44 32 42 16 32 6Z" fill="#e2e8f0"/>
            <path d="M32 6C27 16 25 32 25 40H39C39 32 37 16 32 6Z" fill="#38bdf8"/>
            <path d="M16 30L20 36V44L12 40V34L16 30Z" fill="#94a3b8"/>
            <path d="M48 30L44 36V44L52 40V34L48 30Z" fill="#94a3b8"/>
            <circle cx="32" cy="22" r="4" fill="#0f172a" stroke="#cbd5e1" stroke-width="1.5"/>
        </svg>
    </div>

    <!-- 全局 JS 逻辑 (光标、控制面板、Canvas 绘制全在此文件中) -->
    <script src="javascript.js"></script>
</body>
</html>
